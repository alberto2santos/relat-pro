<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Acompanhe os relatórios diários de obra com o Relat Pro RDO." />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.open-meteo.com https://archive-api.open-meteo.com http://localhost:* http://127.0.0.1:* ws://localhost:3000 ws://127.0.0.1:*; font-src 'self' data:; img-src 'self' data: blob: https://*.supabase.co http://localhost:* http://127.0.0.1:*; manifest-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'"
    />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>Relat Pro RDO | Relatórios Diários de Obra</title>
    <script>
      (() => {
        try {
          const temaSalvo = localStorage.getItem('theme');
          const prefereEscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', temaSalvo === 'dark' || (temaSalvo !== 'light' && prefereEscuro));
        } catch {
          // A aplicação continua disponível mesmo quando o navegador bloqueia o armazenamento local.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
